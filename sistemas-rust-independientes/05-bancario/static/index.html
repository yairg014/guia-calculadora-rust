<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Bancario</title><link rel="stylesheet" href="/estilos.css"></head><body><main><header><h1>Sistema Bancario</h1><p>Gestión de cuentas, saldos y movimientos.</p></header><p class="mensaje">{{MENSAJE}}</p><section class="saldo">Saldo total del banco <strong>$ {{TOTAL}}</strong></section><section class="formularios"><form method="post" action="/cuenta"><h2>Nueva cuenta</h2><input name="numero" placeholder="Número de cuenta" required><input name="titular" placeholder="Titular" required><button>Crear cuenta</button></form><form method="post" action="/movimiento"><h2>Movimiento</h2><input name="numero" placeholder="Número de cuenta" required><input name="monto" type="number" min="0.01" step="0.01" placeholder="Monto" required><input name="fecha" type="date" required><select name="tipo"><option value="deposito">Depósito</option><option value="retiro">Retiro</option></select><button>Registrar movimiento</button></form></section><section><h2>Cuentas registradas</h2><table><thead><tr><th>Cuenta</th><th>Titular</th><th>Saldo</th></tr></thead><tbody>{{CUENTAS}}</tbody></table></section></main></body></html>
