<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloc de Notas</title><link rel="stylesheet" href="/estilos.css"></head><body><main><header><div><span>ORGANIZADOR PERSONAL</span><h1>Bloc de Notas</h1></div><a href="/">Nueva nota</a></header><p class="mensaje">{{MENSAJE}}</p><div class="layout"><aside><form class="filtros" method="get"><input name="buscar" value="{{BUSCAR}}" placeholder="Buscar en contenido"><input name="categoria_filtro" value="{{FILTRO}}" placeholder="Filtrar categoría"><button>Filtrar</button></form><p class="contador">{{TOTAL}} notas encontradas</p><div>{{NOTAS}}</div></aside><section class="editor"><h2>Escribir nota</h2><form action="/guardar" method="post"><input type="hidden" name="id" value="{{ID}}"><label>Título</label><input name="titulo" value="{{TITULO}}" maxlength="60" required><label>Categoría</label><input name="categoria" value="{{CATEGORIA}}" maxlength="30" placeholder="Escuela, personal, trabajo..." required><label>Fecha</label><input type="date" name="fecha" value="{{FECHA}}" required><label class="marca"><input type="checkbox" name="destacada" value="si" {{ESTRELLA}}> Nota destacada</label><label>Contenido</label><textarea name="contenido" maxlength="1800" required>{{CONTENIDO}}</textarea><button class="principal">Guardar nota</button></form></section></div></main></body></html>
