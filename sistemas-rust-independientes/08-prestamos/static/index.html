<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Préstamos</title><link rel="stylesheet" href="/estilos.css"></head><body><main><header><h1>Sistema de Préstamos</h1><p>Créditos, abonos y saldos pendientes.</p></header><p class="mensaje">{{MENSAJE}}</p><form action="/prestamo" method="post"><h2>Registrar préstamo</h2><input name="folio" placeholder="Folio" required><input name="cliente" placeholder="Cliente" required><input name="monto" type="number" min="0.01" step="0.01" placeholder="Monto" required><input name="interes" type="number" min="0" step="0.01" placeholder="Interés" required><input name="fecha" type="date" required><button>Guardar préstamo</button></form><form action="/abono" method="post"><h2>Registrar abono</h2><input name="folio" placeholder="Folio del préstamo" required><input name="monto" type="number" min="0.01" step="0.01" placeholder="Abono" required><input name="fecha" type="date" required><button>Guardar abono</button></form></main></body></html>
